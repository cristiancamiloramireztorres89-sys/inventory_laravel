<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Top Isometric Face Gradient -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Left Isometric Face Gradient -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Right Isometric Face Gradient -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <!-- Accent Emerald Face for Secondary Mini-Box -->
    <linearGradient id="emeraldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="emeraldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="3" stroke-opacity="0.4" />
  
  <!-- Subtle Inner Glow -->
  <circle cx="64" cy="64" r="44" fill="#3b82f6" opacity="0.15" filter="url(#glow)"/>

  <!-- Main 3D Box (Isometric) -->
  <g transform="translate(4, 2)">
    <!-- Top Face -->
    <polygon points="60,26 94,44 60,62 26,44" fill="url(#topFace)" stroke="#93c5fd" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Left Face -->
    <polygon points="26,44 60,62 60,98 26,80" fill="url(#leftFace)" stroke="#60a5fa" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Right Face -->
    <polygon points="60,62 94,44 94,80 60,98" fill="url(#rightFace)" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Tape / Ribbon Seams on Top -->
    <polygon points="56,28 64,32 64,60 56,56" fill="#93c5fd" opacity="0.6"/>
    <polygon points="35,49 43,45 77,63 69,67" fill="#93c5fd" opacity="0.6"/>

    <!-- Mini Emerald Smart Indicator / Tag on Top Corner -->
    <polygon points="82,24 98,32 86,39 70,30" fill="url(#emeraldTop)" stroke="#a7f3d0" stroke-width="1"/>
    <polygon points="70,30 86,39 86,52 70,43" fill="url(#emeraldLeft)" stroke="#6ee7b7" stroke-width="1"/>
    
    <!-- Sparkle / Light Reflex -->
    <circle cx="60" cy="26" r="3" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="82" cy="24" r="2" fill="#ffffff"/>
  </g>
</svg>
